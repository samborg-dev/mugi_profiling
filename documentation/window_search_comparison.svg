00000" y="430.000000" width="264.000000" height="86.000000" stroke="#9aa0a6" fill="#f4f4f6" style="stroke-width:2;" /></g><text x="132.000000" y="480.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:19px">Per-layer windows</text></g><g class="Y29tcGFyaXNvbi5jMl9oZWFk head"><g class="shape" ><rect x="264.000000" y="0.000000" width="315.000000" height="86.000000" stroke="#9aa0a6" fill="#eceef2" style="stroke-width:2;" /></g><text x="421.500000" y="50.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px">Daniel — newton branch</text></g><g class="Y29tcGFyaXNvbi5jMl9sb29w cell"><g class="shape" ><rect x="264.000000" y="86.000000" width="315.000000" height="86.000000" stroke="#c8c8c8" fill="#ffffff" style="stroke-width:2;" /></g><text x="421.500000" y="136.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:19px">human edits YAML, resubmits</text></g><g class="Y29tcGFyaXNvbi5jMl9zZWVk cell"><g class="shape" ><rect x="264.000000" y="172.000000" width="315.000000" height="86.000000" stroke="#c8c8c8" fill="#ffffff" style="stroke-width:2;" /></g><text x="421.500000" y="222.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:19px">manual, outside the useful range</text></g><g class="Y29tcGFyaXNvbi5jMl9zdG9w cell"><g class="shape" ><rect x="264.000000" y="258.000000" width="315.000000" height="86.000000" stroke="#c8c8c8" fill="#ffffff" style="stroke-width:2;" /></g><text x="421.500000" y="308.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:19px">operator judgement</text></g><g class="Y29tcGFyaXNvbi5jMl9yZWxvYWQ= cell"><g class="shape" ><rect x="264.000000" y="344.000000" width="315.000000" height="86.000000" stroke="#c8c8c8" fill="#ffffff" style="stroke-width:2;" /></g><text x="421.500000" y="394.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:19px">≈32</text></g><g c